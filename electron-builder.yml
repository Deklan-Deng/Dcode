appId: dev.dcode.desktop
productName: Dcode
copyright: MIT

directories:
  output: dist
  buildResources: build

# The app shell plus the self-update source config. The bundled harness
# (source + built dist) must also ship; add it before the first packaged build:
# files:
#   - harness/**/*
#   - "!harness/node_modules/**"
files:
  - src/**/*
  - package.json
  - update-config.json
  - build/trayTemplate.png
  - build/trayTemplate@2x.png
  - "!node_modules/.cache/**"

asar: true

# The bundled harness snapshot (built tree + node_modules, packed by
# scripts/pack-harness.mjs) ships OUTSIDE the asar as extraResources, so the
# packaged app can extract it into userData on first run — no git, no pnpm,
# no network, and the official repo is never consulted at runtime.
extraResources:
  - from: pack/harness.tgz
    to: harness.tgz
  - from: pack/harness.meta.json
    to: harness.meta.json

# Package-based self-update (electron-updater). The github provider reads the
# `repository` field in package.json at publish time; set it to your GitHub
# repo before running `electron-builder --publish always`.
publish:
  provider: github

mac:
  category: public.app-category.developer-tools
  target:
    - dmg
    - zip
  # Icons: build/icon.icns (mac) and build/icon.ico (win) are picked up
  # automatically from buildResources; the DeepSeek fish mark lives there.

win:
  target:
    - nsis

npmRebuild: false
