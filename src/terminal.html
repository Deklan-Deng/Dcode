<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'" />
  <title>终端</title>
  <link rel="stylesheet" href="../node_modules/@xterm/xterm/css/xterm.css" />
  <style>
    :root { color-scheme: dark; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; background: #0b0e14; overflow: hidden; }
    body {
      display: flex;
      flex-direction: column;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #header {
      flex: none;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 6px 0 12px;
      background: #10151f;
      border-bottom: 1px solid #232c3f;
      cursor: ns-resize;
      user-select: none;
    }
    #header .title {
      font-size: 11px;
      font-weight: 600;
      color: #8fa0c0;
      letter-spacing: .4px;
    }
    #close {
      border: none;
      background: transparent;
      color: #7d8aa0;
      font-size: 12px;
      line-height: 1;
      padding: 4px 7px;
      border-radius: 5px;
      cursor: pointer;
    }
    #close:hover { background: #1a2233; color: #e6ecf7; }
    #term {
      flex: 1;
      min-height: 0;
      position: relative;
      padding: 6px 0 6px 10px;
    }
    #exitbar {
      display: none;
      flex: none;
      background: #1a1216;
      color: #ff9d9d;
      border-top: 1px solid #43222a;
      font-size: 12px;
      line-height: 1.6;
      padding: 4px 12px;
    }
  </style>
</head>
<body>
  <div id="header">
    <span class="title">终端</span>
    <button id="close" title="关闭终端 (Ctrl+`)">✕</button>
  </div>
  <div id="term"></div>
  <div id="exitbar"></div>
  <script src="../node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script src="../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
  <script src="./terminal.js"></script>
</body>
</html>
