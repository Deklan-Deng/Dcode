<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>Dcode</title>
  <style>
    :root { color-scheme: dark; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; background: #14161d; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }
    #bar {
      height: 36px;
      display: flex;
      align-items: center;
      background: #14161d;
      border-bottom: 1px solid #232c3f;
      -webkit-app-region: drag;
    }
    /* Room for the macOS traffic lights (hiddenInset title bar). */
    .spacer { flex: none; width: 76px; height: 100%; }
    .right {
      margin-left: auto;
      display: flex;
      align-items: center;
      padding-right: 10px;
      -webkit-app-region: no-drag;
    }
    .iconbtn {
      border: 1px solid transparent;
      background: transparent;
      color: #9aa4b2;
      font-size: 12px;
      font-family: ui-monospace, Menlo, monospace;
      padding: 4px 9px;
      border-radius: 6px;
      cursor: pointer;
      line-height: 1;
    }
    .iconbtn:hover { background: #1a1e28; color: #e6ecf7; }
    .iconbtn.active { border-color: rgba(77, 107, 254, .5); color: #a9bdff; background: #10162a; }
  </style>
</head>
<body>
  <div id="bar">
    <div class="spacer"></div>
    <div class="right">
      <button id="term-toggle" class="iconbtn" title="切换终端面板 (Ctrl+`)">&gt;_</button>
    </div>
  </div>
  <script src="./header.js"></script>
</body>
</html>
