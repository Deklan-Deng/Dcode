<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>Dcode</title>
  <style>
    :root { color-scheme: dark; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; background: #14161d; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }
    #bar {
      height: 36px;
      display: flex;
      align-items: center;
      background: #14161d;
      border-bottom: 1px solid #232c3f;
      -webkit-app-region: drag;
    }
    /* Room for the macOS traffic lights (hiddenInset title bar). */
    .spacer { flex: none; width: 76px; height: 100%; }
    .right {
      margin-left: auto;
      display: flex;
      align-items: center;
      padding-right: 10px;
      -webkit-app-region: no-drag;
    }
    .iconbtn {
      border: 1px solid transparent;
      background: transparent;
      color: #9aa4b2;
      font-size: 12px;
      font-family: ui-monospace, Menlo, monospace;
      padding: 4px 9px;
      border-radius: 6px;
      cursor: pointer;
      line-height: 1;
    }
    .iconbtn:hover { background: #1a1e28; color: #e6ecf7; }
    .iconbtn.active { border-color: rgba(77, 107, 254, .5); color: #a9bdff; background: #10162a; }
    .iconbtn.gh { display: inline-flex; align-items: center; justify-content: center; }
  </style>
</head>
<body>
  <div id="bar">
    <div class="spacer"></div>
    <div class="right">
      <button id="term-toggle" class="iconbtn" title="切换终端面板 (Ctrl+`)">&gt;_</button>
      <button id="github" class="iconbtn gh" title="GitHub — Dcode 开源仓库">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
          <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
        </svg>
      </button>
    </div>
  </div>
  <script src="./header.js"></script>
</body>
</html>
