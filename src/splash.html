<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'" />
  <title>Dcode</title>
  <style>
    :root { color-scheme: dark; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0b0e14;
      color: #c9d4e3;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      user-select: none;
      -webkit-app-region: drag;
    }
    .mark {
      width: 44px; height: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, #4d6bfe 0%, #1a2a6c 100%);
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 20px; color: #fff;
      box-shadow: 0 4px 18px rgba(77, 107, 254, .35);
    }
    h1 { font-size: 15px; font-weight: 600; letter-spacing: .2px; }
    .status {
      font-size: 12px; color: #7d8aa0;
      max-width: 380px; text-align: center;
      min-height: 16px; line-height: 16px;
      overflow: hidden; text-overflow: ellipsis;
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
    }
    .spinner {
      width: 18px; height: 18px;
      border: 2px solid #2a3446; border-top-color: #4d6bfe;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #error {
      display: none;
      width: 380px; max-height: 120px;
      overflow: auto;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11px; line-height: 1.5;
      color: #ff9d9d;
      background: #1a1216;
      border: 1px solid #43222a;
      border-radius: 8px;
      padding: 10px;
      white-space: pre-wrap;
      -webkit-app-region: no-drag;
    }
    #quit {
      display: none;
      border: 1px solid #3a455c;
      background: transparent; color: #c9d4e3;
      border-radius: 8px; padding: 7px 22px;
      font-size: 12px; cursor: pointer;
      -webkit-app-region: no-drag;
    }
    #quit:hover { background: #1a2233; }
  </style>
</head>
<body>
  <div class="mark">D</div>
  <h1>Dcode</h1>
  <div class="spinner" id="spinner"></div>
  <div class="status" id="status">Starting…</div>
  <pre id="error"></pre>
  <button id="quit">Quit</button>
  <script>
    const statusEl = document.getElementById('status')
    const errorEl = document.getElementById('error')
    const quitEl = document.getElementById('quit')
    const spinnerEl = document.getElementById('spinner')
    window.dshDesktop.onStatus((text) => { statusEl.textContent = text })
    window.dshDesktop.onFailure((text) => {
      spinnerEl.style.display = 'none'
      statusEl.textContent = 'Failed to start DeepSeek Harness.'
      errorEl.textContent = text
      errorEl.style.display = 'block'
      quitEl.style.display = 'block'
    })
    quitEl.addEventListener('click', () => window.dshDesktop.quit())
  </script>
</body>
</html>
